<title>Drive Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column like a dashboard-mounted phone; a motorway-sign panel for the live drive; bottom tab bar. */
:root {
  --bg: #eceff3; --surface: #ffffff; --ink: #142030; --muted: #586677; --line: #d3dae3;
  --sign: #1f4c8f; --sign-ink: #ffffff; --sign-line: rgba(255,255,255,.85);
  --amber: #b97400; --amber-fill: #f2a516; --amber-soft: #fcefd3;
  --brk: #8a96a6; --good: #2d7a4c; --bad: #b8402b;
  --f-display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --f-body: "Overpass", "Segoe UI", system-ui, sans-serif;
  --f-num: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141b; --surface: #17202a; --ink: #e6ebf1; --muted: #93a0b0; --line: #29343f;
  --sign: #2a5ca6; --sign-ink: #ffffff; --sign-line: rgba(255,255,255,.75);
  --amber: #f3b23f; --amber-fill: #e89d17; --amber-soft: #3a2b10;
  --brk: #5d6a79; --good: #5fbf86; --bad: #e57a62; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141b; --surface: #17202a; --ink: #e6ebf1; --muted: #93a0b0; --line: #29343f;
  --sign: #2a5ca6; --sign-ink: #ffffff; --sign-line: rgba(255,255,255,.75);
  --amber: #f3b23f; --amber-fill: #e89d17; --amber-soft: #3a2b10;
  --brk: #5d6a79; --good: #5fbf86; --bad: #e57a62; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 110px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 1.55rem; font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: 1.1rem; font-weight: 700; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.label { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.store-pill { font-size: .72rem; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.field { display: grid; gap: 5px; min-width: 0; }
.field label { font-size: .8rem; font-weight: 600; color: var(--muted); }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 11px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--sign); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ft { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
@media (max-width: 380px) { .row3 { grid-template-columns: 1fr 1fr; } }

button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px 14px; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--sign); color: var(--sign-ink); border-color: var(--sign); }
.btn-big { padding: 15px 16px; font-size: 1.05rem; width: 100%; }
.btn-danger { color: var(--bad); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 8px; }
.btn-icon { padding: 9px 11px; }

/* Live drive: motorway sign */
.sign { background: var(--sign); color: var(--sign-ink); border-radius: 12px; padding: 6px; }
.sign-in { border: 2px solid var(--sign-line); border-radius: 8px; padding: 16px 16px 14px; display: grid; gap: 10px; }
.sign-route { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.sign-route .arrow { opacity: .8; }
.clock { font-family: var(--f-num); font-weight: 600; font-size: clamp(2.8rem, 15vw, 4.2rem); line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.sign-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .9rem; }
.sign-stats b { font-family: var(--f-num); font-weight: 600; }
.sign .label { color: var(--sign-ink); opacity: .8; }
.state-chip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 3px 9px; border-radius: 4px; background: rgba(255,255,255,.16); width: fit-content; }
.state-chip.slow { background: var(--amber-fill); color: #1b1300; }
.state-chip.brk { background: rgba(255,255,255,.3); }

.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn-slow { background: var(--amber-soft); border: 2px solid var(--amber-fill); color: var(--ink); padding: 18px 10px; font-size: 1.05rem; }
.btn-slow.on { background: var(--amber-fill); color: #1b1300; }
.btn-break { padding: 18px 10px; font-size: 1.05rem; }
.btn-break.on { background: var(--brk); color: #fff; border-color: var(--brk); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 11px; border-radius: 99px; font-size: .85rem; font-weight: 600; background: var(--bg); }
.chip.on { background: var(--amber-fill); border-color: var(--amber-fill); color: #1b1300; }
.gps-line { font-size: .82rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--brk); display: inline-block; }
.dot.on { background: var(--good); }

/* Timeline bar, drawn to scale */
.tl { position: relative; height: 14px; border-radius: 3px; background: color-mix(in srgb, var(--sign) 22%, var(--bg)); overflow: hidden; }
.tl span { position: absolute; top: 0; bottom: 0; }
.tl .s { background: var(--amber-fill); }
.tl .b { background: var(--brk); }
.tl-legend { display: flex; gap: 14px; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* Location + photos */
.here { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.btn-loc { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; font-size: .9rem; }
.btn-loc svg { width: 17px; height: 17px; stroke: var(--sign); fill: none; stroke-width: 2; }
.hint { font-size: .82rem; color: var(--muted); }
.hint.warn { color: var(--amber); }
.inline { display: flex; gap: 8px; }
.inline input { flex: 1 1 auto; }
.inline button { white-space: nowrap; }
[hidden] { display: none !important; }
.btn-photo { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 9px 12px; font-weight: 600; font-size: .9rem; }
.btn-photo svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linejoin: round; }
.btn-photo:focus-within { outline: 2px solid var(--sign); outline-offset: 2px; }
.photo-status { display: flex; gap: 10px; align-items: center; font-size: .82rem; color: var(--muted); min-height: 0; }
.photo-status:empty { display: none; }
.thumb { width: 56px; height: 42px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); flex: none; }
.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photos figure { margin: 0; display: grid; gap: 4px; font-size: .8rem; color: var(--muted); }
.photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }

.offer { background: var(--surface); border: 2px solid var(--sign); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.offer h2 { font-size: 1.15rem; }
.slow-edit { display: flex; gap: 10px; align-items: center; font-size: .9rem; padding: 6px 0; border-top: 1px solid var(--line); }
.slow-edit:first-of-type { border-top: 0; }
.slow-edit input { width: auto; }

.check { display: flex; gap: 8px; align-items: flex-start; font-size: .9rem; }
.check input { width: auto; margin-top: 3px; }
.route-map { width: 100%; height: auto; display: block; background: color-mix(in srgb, var(--sign) 6%, var(--bg)); border-radius: 8px; border: 1px solid var(--line); }
.share { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.share a { color: var(--sign); font-weight: 600; }

.journeys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.journey { text-align: left; display: grid; gap: 2px; padding: 12px; border: 1px solid var(--line); background: var(--bg); }
.journey b { font-size: 1rem; }
.journey span { font-size: .8rem; color: var(--muted); font-weight: 400; overflow-wrap: anywhere; }
.journey .num { color: var(--sign); font-weight: 600; }
.ins { display: grid; gap: 4px; }
.ins-row { display: grid; grid-template-columns: 7.5em 1fr auto 2.2em; gap: 8px; align-items: center; font-size: .84rem; }
.ins-bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
.ins-bar i { display: block; height: 100%; background: color-mix(in srgb, var(--sign) 60%, var(--bg)); }
.ins-notes { display: grid; gap: 4px; font-size: .9rem; padding: 10px 12px; background: color-mix(in srgb, var(--sign) 8%, var(--surface)); border-radius: 8px; }
.sign-eta { font-size: .9rem; opacity: .92; }
.hol-row { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 6px; align-items: center; font-size: .85rem; }
.hol-row input { padding: 7px 8px; }

.cars { display: grid; gap: 6px; }
.car-row { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; text-align: left; font-weight: 400; background: var(--bg); }
.car-row.on { border-color: var(--sign); box-shadow: inset 0 0 0 1px var(--sign); }
.car-row .tag { margin-left: auto; }

/* Log */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 460px) { .stats { grid-template-columns: 1fr 1fr; } }
.stat { display: grid; gap: 2px; }
.stat .v { font-family: var(--f-num); font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.trip { display: grid; gap: 8px; padding: 13px 0; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; text-align: left; font-weight: 400; width: 100%; color: var(--ink); padding-inline: 0; }
.trip:first-child { border-top: 0; }
.trip-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.trip-route { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.trip-dur { font-family: var(--f-num); font-weight: 600; white-space: nowrap; }
.trip-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .84rem; color: var(--muted); }
.trip-meta .slow { color: var(--amber); font-weight: 600; }
.tag { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
.empty { text-align: center; padding: 26px 10px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty svg { color: var(--muted); }

/* Routes */
.route { display: grid; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.route:first-child { border-top: 0; padding-top: 0; }
.route-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 46px; }
.bars span { flex: 1 1 0; max-width: 22px; background: color-mix(in srgb, var(--sign) 55%, var(--bg)); border-radius: 2px 2px 0 0; position: relative; }
.bars span.best { background: var(--good); }
.bars span .sl { position: absolute; left: 0; right: 0; bottom: 0; background: var(--amber-fill); border-radius: 0; }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; font-size: .84rem; }
@media (max-width: 460px) { .kv { grid-template-columns: 1fr 1fr; } }
.kv b { display: block; font-family: var(--f-num); font-weight: 600; font-size: .95rem; }

/* Detail */
.slow-list { display: grid; gap: 0; }
.slow-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: .9rem; }
.slow-item:first-child { border-top: 0; }
.slow-item a { color: var(--sign); }
.confirm { background: var(--amber-soft); border: 1px solid var(--amber-fill); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row > * { flex: 1 1 auto; }

/* Bottom nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { border: 0; background: none; border-radius: 0; padding: 9px 4px 10px; display: grid; justify-items: center; gap: 2px; font-size: .74rem; color: var(--muted); font-weight: 600; }
nav.tabs button[aria-current="page"] { color: var(--sign); }
nav.tabs button[aria-current="page"] svg { stroke: var(--sign); }
nav.tabs svg { width: 22px; height: 22px; stroke: var(--muted); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber-fill); position: absolute; margin-left: 16px; margin-top: -2px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 15px; border-radius: 8px; font-size: .88rem; z-index: 9; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .btn-slow.on { animation: pulse 1.6s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--amber-fill) 30%, transparent); } } }
</style>

<div class="wrap" id="app">
  <header class="top">
    <h1>Drive Log</h1>
    <span class="store-pill" id="storePill">Connecting…</span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="drive" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.6 11.2 3.4 9.5M14.4 11.2l6.2-1.7"/></svg>Drive<span class="live-dot" id="liveDot" hidden></span></button>
    <button data-tab="log"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Log</button>
    <button data-tab="routes"><svg viewBox="0 0 24 24"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"/></svg>Routes</button>
    <button data-tab="fuel"><svg viewBox="0 0 24 24"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h12M7 8h6"/><path d="M15 10h2a1.5 1.5 0 0 1 1.5 1.5v5a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>Fuel</button>
    <button data-tab="car"><svg viewBox="0 0 24 24"><path d="M5 17h14v-4.5l-2-5H7l-2 5V17Z"/><path d="M5 12.5h14"/><circle cx="8" cy="17" r="1.6"/><circle cx="16" cy="17" r="1.6"/></svg>Cars</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const LITRES_PER_UK_GALLON = 4.54609;
const REASONS = ["Traffic", "Roadworks", "Accident", "Junction", "Weather", "School run", "Other"];
const KINDS = ["Commute", "School run", "Heading home", "Shopping", "Visiting", "Day out"];
// Typical England school holidays. Councils differ, so these are editable on the Car tab.
const DEFAULT_HOLIDAYS = [["2026-07-22", "2026-09-02"], ["2026-10-26", "2026-10-30"], ["2026-12-21", "2027-01-01"], ["2027-02-15", "2027-02-19"], ["2027-03-29", "2027-04-09"], ["2027-05-31", "2027-06-04"], ["2027-07-23", "2027-09-01"]];
// Bank holidays, England and Wales.
const BANK_HOLIDAYS = new Set(["2025-01-01", "2025-04-18", "2025-04-21", "2025-05-05", "2025-05-26", "2025-08-25", "2025-12-25", "2025-12-26",
  "2026-01-01", "2026-04-03", "2026-04-06", "2026-05-04", "2026-05-25", "2026-08-31", "2026-12-25", "2026-12-28",
  "2027-01-01", "2027-03-26", "2027-03-29", "2027-05-03", "2027-05-31", "2027-08-30", "2027-12-27", "2027-12-28"]);
const FUELS = ["Petrol", "Diesel", "Hybrid", "LPG"];
// Settings: every car, which one new drives use, and school holidays. Older saves held a single car's fields at the top level.
function normaliseSettings(raw = {}) {
  const st = { holidays: raw.holidays || DEFAULT_HOLIDAYS, currentCarId: raw.currentCarId, cars: Array.isArray(raw.cars) ? raw.cars.slice() : [] };
  if (!st.cars.length) st.cars = [{ id: "car1", name: raw.name || "My car", fuel: raw.fuel || "Petrol", mpg: raw.mpg || 45, ppl: raw.ppl || 136.9 }];
  if (!st.cars.some((c) => c.id === st.currentCarId)) st.currentCarId = st.cars[0].id;
  return st;
}
const carById = (id) => state.car.cars.find((c) => c.id === id);
const curCar = () => carById(state.car.currentCarId) || state.car.cars[0];

const state = {
  tab: "drive", detailId: null, editing: false, confirmDel: false, confirmDiscard: false, ending: false,
  car: normaliseSettings(), trips: [], fuel: [], fuelForm: null, editCarId: null, confirmCarDel: false, active: null, mode: "loading",
  gps: "off", gpsSpeed: null, routeFilter: null, shareTrim: true,
};

/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const sum = (arr, f) => (arr || []).reduce((a, x) => a + f(x), 0);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function fmtDur(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h) return `${h}h ${pad(m)}m`;
  if (m >= 10) return `${m}m`;
  if (m) return `${m}m ${pad(s % 60)}s`;
  return `${s}s`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 3600)}:${pad(Math.floor((s % 3600) / 60))}:${pad(s % 60)}`;
}
const fmtMoney = (v) => v == null ? "–" : "£" + v.toFixed(2);
const fmtMi = (v) => v == null || !v ? "–" : (v < 10 ? v.toFixed(1) : Math.round(v)) + " mi";
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const fmtTime = (t) => new Date(t).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
const routeName = (t) => `${(t.from || "Start").trim()} → ${(t.to || "Finish").trim()}`;
const routeKey = (t) => routeName(t).toLowerCase().replace(/\s+/g, " ");
let toastTimer;
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), 2600); }

function stats(t, now = Date.now()) {
  const end = t.endedAt || now;
  const total = end - t.startedAt;
  const brk = sum(t.breaks, (b) => (b.end || end) - b.start);
  const slow = sum(t.slow, (s) => (s.end || end) - s.start);
  const moving = Math.max(0, total - brk);
  const miles = t.endedAt ? (t.distance || 0) : (t.gpsMiles || 0);
  const avg = miles && moving > 60000 ? miles / (moving / 3600000) : null;
  const c = carById(t.carId) || curCar(), mpg = t.mpg ?? c.mpg, ppl = t.ppl ?? c.ppl;

    stillSince = null;

    // Driving off again ends a break by itself, so nobody has to touch the phone.

function topRoutes() {
  const map = new Map();
  state.trips.forEach((t) => { const k = routeKey(t); if (!map.has(k)) map.set(k, { key: k, name: routeName(t), trips: [] }); map.get(k).trips.push(t); });
  return [...map.values()].sort((a, b) => b.trips.length - a.trips.length || b.trips[0].startedAt - a.trips[0].startedAt);
}
function renderRoutes() {
  const routes = topRoutes();
  if (!routes.length) return `<section class="panel">${renderEmpty()}</section>`;
  return `<section class="panel"><div style="display:grid;gap:4px"><h2>Your routes</h2><div class="muted" style="font-size:.88rem">Drives grouped by where they start and end. Each bar is one run, oldest first, with slow time in amber and your quickest run in green.</div></div>
  ${routes.map((r) => {
    const runs = r.trips.slice().reverse().map((t) => ({ t, st: stats(t) }));
    const times = runs.map((x) => x.st.moving), max = Math.max(...times, 1), min = Math.min(...times);
    const avg = sum(times, (x) => x) / times.length;
    const avgSlow = sum(runs, (x) => x.st.slow) / runs.length;
    const costs = runs.map((x) => x.st.cost).filter((c) => c != null);
    const reasons = {}; runs.forEach((x) => x.t.slow.forEach((s) => { const k = s.reason || "Unlabelled"; reasons[k] = (reasons[k] || 0) + (s.end - s.start); }));
    const topReason = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
    return `<div class="route">
      <div class="route-head"><b>${esc(r.name)}</b><span class="muted" style="font-size:.84rem">${r.trips.length} drive${r.trips.length > 1 ? "s" : ""}</span></div>
      <div class="bars" role="img" aria-label="Duration of each drive on this route">${runs.slice(-24).map((x) => `<span class="${runs.length > 1 && x.st.moving === min ? "best" : ""}" style="height:${((x.st.moving / max) * 100).toFixed(1)}%" title="${fmtDate(x.t.startedAt)}: ${fmtDur(x.st.moving)}"><span class="sl" style="height:${x.st.moving ? ((x.st.slow / x.st.moving) * 100).toFixed(1) : 0}%"></span></span>`).join("")}</div>
      <div class="kv">
        <div><span class="label">Typical</span><b>${fmtDur(avg)}</b></div>
        <div><span class="label">Quickest</span><b>${fmtDur(min)}</b></div>
        <div><span class="label">Slowest</span><b>${fmtDur(max)}</b></div>
        <div><span class="label">Fuel avg</span><b>${costs.length ? fmtMoney(sum(costs, (c) => c) / costs.length) : "–"}</b></div>
      </div>
      <div class="trip-meta">${avgSlow > 15000 ? `<span class="slow">${fmtDur(avgSlow)} slow on average</span>` : `<span>Usually a clear run</span>`}${topReason && avgSlow > 15000 ? `<span>Mostly ${esc(topReason[0].toLowerCase())}</span>` : ""}</div>
      ${insights(r.trips)}
      <div class="btn-row"><button data-act="route-log" data-key="${esc(r.key)}">See drives</button><button data-act="quick" data-from="${esc(r.trips[0].from || "")}" data-to="${esc(r.trips[0].to || "")}">Drive it now</button></div>
    </div>`;
  }).join("")}</section>`;
}

// Background updates skip re-rendering while someone is typing in a form, so their input isn't wiped.
function softRender() {
  const f = document.activeElement;
  if (f && f.form && f.matches("input, textarea, select")) return;
  render();
}
function render() {
  const pill = $("#storePill");
  pill.textContent = { loading: "Connecting…", cloud: "Saved to your account", local: "Saved on this device" }[state.mode];
  document.querySelectorAll("nav.tabs button").forEach((b) => b.dataset.tab === state.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  $("#liveDot").hidden = !state.active;
  const v = $("#view");
  v.style.display = "grid"; v.style.gap = "14px";
  v.innerHTML = state.tab === "drive" ? renderDrive() : state.tab === "log" ? renderLog() : state.tab === "routes" ? renderRoutes() : state.tab === "fuel" ? renderFuel() : renderCar();
  if (state.tab === "drive" && !state.active) updateExpect();
}

/* ---------- samples (clearly marked, removable) ---------- */
async function addSamples() {
  const day = 86400000, base = new Date(); base.setHours(8, 5, 0, 0);
  const mk = (daysAgo, mins, miles, from, to, slow, notes, kind = null, hh = 8, mm = 5) => {
    const d = new Date(base.getTime() - daysAgo * day); d.setHours(hh, mm, 0, 0); const s = d.getTime();
    return { id: "sample-" + daysAgo, sample: true, from, to, startedAt: s, endedAt: s + mins * 60000, distance: miles, distanceSource: "manual",
      slow: slow.map(([at, len, reason]) => ({ start: s + at * 60000, end: s + (at + len) * 60000, reason, auto: false, lat: null, lon: null })),
      breaks: [], notes, kind, carId: curCar().id, mpg: curCar().mpg, ppl: curCar().ppl, car: curCar().name };
  };
  const samples = [
    mk(1, 38, 21.6, "Home", "Office", [[9, 7, "Traffic"], [27, 3, "Roadworks"]], "Sample drive. Queue at the ring road roundabout.", "Commute"),
    mk(3, 29, 21.4, "Home", "Office", [[11, 2, "Junction"]], "Sample drive.", "Commute"),
    mk(8, 41, 21.5, "Home", "Office", [[8, 10, "Traffic"]], "Sample drive.", "Commute", 8, 20),
    mk(9, 26, 21.4, "Home", "Office", [], "Sample drive. Left early.", "Commute", 6, 40),
    mk(10, 27, 21.6, "Home", "Office", [[12, 1, "Junction"]], "Sample drive. Left early.", "Commute", 6, 45),
    mk(6, 74, 58.2, "Home", "Coast", [[40, 9, "Traffic"]], "Sample drive. Coffee at the services would go under Break."),
  ];
  for (const t of samples) await store.saveTrip(t);
  toast("Added sample drives");
  render();
}

/* ---------- export ---------- */
async function exportCsv() {
  const head = ["Date", "Start", "End", "From", "To", "Miles", "Driving (min)", "Slow (min)", "Breaks (min)", "Slow points", "Avg mph", "Litres", "Fuel £", "Notes"];
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = state.trips.filter((t) => !t.sample).map((t) => { const st = stats(t);
    return [new Date(t.startedAt).toISOString().slice(0, 10), fmtTime(t.startedAt), fmtTime(t.endedAt), t.from, t.to, st.miles || "", Math.round(st.moving / 60000), Math.round(st.slow / 60000), Math.round(st.brk / 60000),
      t.slow.map((s) => `${fmtTime(s.start)} ${s.reason || "Slow"} ${Math.round((s.end - s.start) / 60000)}m`).join("; "), st.avg ? st.avg.toFixed(1) : "", st.litres != null ? st.litres.toFixed(2) : "", st.cost != null ? st.cost.toFixed(2) : "", t.notes].map(q).join(","); });
  try { await saveFile("drive-log.csv", [head.map(q).join(","), ...rows].join("\n")); }
  catch (e) { if (e && e.code !== "declined") toast("Couldn't export the log."); }
}

/* ---------- events ---------- */
document.addEventListener("click", async (e) => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { state.tab = tabBtn.dataset.tab; state.detailId = null; state.editing = state.confirmDel = false; state.fuelForm = null; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case "swap": { const f = $("#from"), t = $("#to"); [f.value, t.value] = [t.value, f.value]; break; }
    case "quick": if (state.active) { state.tab = "drive"; render(); break; } state.kind = el.dataset.kind || null; startDrive(el.dataset.from, el.dataset.to, null); state.tab = "drive"; render(); break;
    case "kind": { const i = $("#kindText"); i.value = i.value.trim().toLowerCase() === el.dataset.k.toLowerCase() ? "" : el.dataset.k; state.kind = i.value || null; kindChipsOn(); break; }
    case "hol-add": { const box = $("#holList"); box.insertAdjacentHTML("beforeend", holRow(["", ""])); break; }
    case "hol-del": el.closest(".hol-row").remove(); break;
    case "here": startFromHere(); break;
    case "pc-name": { const pc = $("#postcode").value.trim(), msg = $("#hereMsg");
      if (!POSTCODE.test(pc)) { msg.className = "hint warn"; msg.textContent = "That doesn't look like a postcode. Try something like RG4 7AB."; break; }
      msg.className = "hint"; msg.textContent = "Looking up " + tidyPostcode(pc) + "…";
      const name = await placeName({ postcode: pc }); $("#from").value = name || tidyPostcode(pc); $("#pcBox").hidden = true;
      msg.textContent = name && name !== tidyPostcode(pc) ? "Named from the postcode. Edit it if you like." : "Postcode added. Type a name for it if you like."; break; }
    case "slow": toggleSlow(); break;
    case "break": toggleBreak(); break;
    case "reason": setReason(el.dataset.r); break;
    case "end": state.ending = true; render(); $("#distance")?.focus(); break;
    case "end-cancel": state.ending = false; if (state.active) { delete state.active.arrivedAt; store.saveActive(false); } render(); break;
    case "offer-end": state.active.arrivedAt = state.offerSince; state.offer = null; state.dismissed = "arrive"; state.ending = true; store.saveActive(false); render(); break;
    case "offer-break": { const a = state.active, at = state.offerSince;
      a.slow = a.slow.filter((x) => x.start < at); a.slow.forEach((x) => { if (!x.end || x.end > at) x.end = at; });
      a.breaks.push({ start: at, end: null }); state.offer = null; state.dismissed = "break"; store.saveActive(); render(); break; }
    case "offer-no": state.dismissed = state.offer; state.offer = null; render(); break;
    case "discard": state.confirmDiscard = true; render(); break;
    case "discard-no": state.confirmDiscard = false; render(); break;
    case "discard-yes": discardDrive(); break;
    case "open": state.detailId = el.dataset.id; state.confirmDel = state.editing = false; render(); window.scrollTo(0, 0); break;
    case "back": state.detailId = null; render(); break;
    case "edit": state.editing = true; render(); break;
    case "cancel-edit": state.editing = false; render(); break;
    case "del": state.confirmDel = true; render(); break;
    case "del-no": state.confirmDel = false; render(); break;
    case "del-yes": { const t = state.trips.find((x) => x.id === state.detailId); const as = await getAssets();
      if (as && t) for (const id of [t.startPhoto, t.endPhoto]) if (id) as.delete(id).catch(() => {}); }
      await store.deleteTrip(state.detailId); state.detailId = null; state.confirmDel = false; render(); toast("Drive deleted"); break;
    case "again": { const t = state.trips.find((x) => x.id === state.detailId); if (state.active) { toast("Finish your current drive first."); break; } state.tab = "drive"; state.detailId = null; startDrive(t.from, t.to, null); break; }
    case "route-log": state.routeFilter = el.dataset.key; state.tab = "log"; state.detailId = null; render(); break;
    case "clear-filter": state.routeFilter = null; render(); break;
    case "goto-drive": state.tab = "drive"; render(); break;
    case "samples": el.disabled = true; await addSamples(); break;
    case "clear-samples": for (const t of state.trips.filter((x) => x.sample)) await store.deleteTrip(t.id); render(); toast("Sample drives removed"); break;
    case "export": exportCsv(); break;
    case "pick-car": state.car.currentCarId = el.dataset.id; store.saveCar({ ...state.car }); document.querySelectorAll('[data-act="pick-car"]').forEach((c) => c.classList.toggle("on", c.dataset.id === el.dataset.id)); break;
    case "car-edit": state.editCarId = el.dataset.id; state.confirmCarDel = false; render(); break;
    case "car-new": state.editCarId = "new"; state.confirmCarDel = false; render(); $("#carName")?.focus(); break;
    case "car-del": state.confirmCarDel = true; render(); break;
    case "car-del-no": state.confirmCarDel = false; render(); break;
    case "car-del-yes": { const id = state.editCarId && carById(state.editCarId) ? state.editCarId : state.car.currentCarId, cars = state.car.cars.filter((c) => c.id !== id);
      await store.saveCar({ ...state.car, cars, currentCarId: state.car.currentCarId === id ? cars[0].id : state.car.currentCarId }); state.editCarId = null; state.confirmCarDel = false; render(); toast("Car removed"); break; }
    case "fuel-car": state.fuelCarId = el.dataset.id; render(); break;
    case "fuel-add": state.fuelForm = { carId: state.fuelCarId || state.car.currentCarId }; state.confirmFuelDel = false; render(); window.scrollTo(0, 0); break;
    case "fuel-open": state.fuelForm = { ...state.fuel.find((x) => x.id === el.dataset.id) }; state.confirmFuelDel = false; render(); window.scrollTo(0, 0); break;
    case "fuel-cancel": state.fuelForm = null; render(); break;
    case "fuel-del": state.confirmFuelDel = true; render(); break;
    case "fuel-del-no": state.confirmFuelDel = false; render(); break;
    case "fuel-del-yes": { const x = state.fuelForm, as = await getAssets(); if (as && x.photo) as.delete(x.photo).catch(() => {});
      await store.deleteFill(x.id); state.fuelForm = null; state.confirmFuelDel = false; render(); toast("Fill-up deleted"); break; }
    case "use-mpg": { const id = el.dataset.id, mpg = parseFloat(el.dataset.mpg);
      await store.saveCar({ ...state.car, cars: state.car.cars.map((c) => (c.id === id ? { ...c, mpg } : c)) }); render(); toast(`Fuel costs now use ${mpg} mpg`); break; }
    case "share-png": sharePng(state.trips.find((x) => x.id === state.detailId)); break;
    case "share-json": shareJson(state.trips.find((x) => x.id === state.detailId)); break;
    case "share-link": { const link = mapsLink(state.trips.find((x) => x.id === state.detailId)), msg = $("#shareMsg"); if (!link) break;
      msg.innerHTML = `<a href="${esc(link)}" target="_blank" rel="noopener">Open in Google Maps</a> · <input readonly value="${esc(link)}" aria-label="Google Maps link" style="margin-top:6px">`;
      navigator.clipboard.writeText(link).then(() => toast("Link copied"), () => { const i = msg.querySelector("input"); i.focus(); i.select(); }); break; }
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "from" || e.target.id === "to") updateExpect();
  if (e.target.id === "kindText") { state.kind = e.target.value.trim() || null; kindChipsOn(); }
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.photo && t.files && t.files[0]) { handlePhoto(t.dataset.photo, t.files[0]); t.value = ""; return; }
  if (t.id === "from" || t.id === "to") nameField(t, $("#hereMsg")).then(updateExpect);
  if (t.id === "odoStartE" || t.id === "odoEnd") fillDistanceFromMileage();
  if (t.id === "distance") t.dataset.auto = "";
  if (t.id === "shareTrim") { state.shareTrim = t.checked; render(); return; }
  if (t.id === "autoSlow" && state.active) { state.active.autoSlow = t.checked; store.saveActive(); }
});
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "startForm") {
    if (state.active) return;
    state.kind = f.kind.value.trim().slice(0, 40) || null;
    startDrive(f.from.value.trim(), f.to.value.trim(), parseFloat(f.odoStart.value) || null);
    if (state.photoReading) toast("Still reading the mileage photo. It'll be added to this drive.");
  } else if (f.id === "endForm") {
    f.querySelector('[type="submit"]').disabled = true;
    await finishDrive(f);
    const b = f.querySelector('[type="submit"]'); if (b) b.disabled = false;
  } else if (f.id === "carForm") {
    const id = f.carId.value === "new" ? uid() : f.carId.value;
    const car = { id, name: f.name.value.trim() || "My car", fuel: f.fuel.value, mpg: parseFloat(f.mpg.value), ppl: parseFloat(f.ppl.value) };
    const cars = state.car.cars.some((x) => x.id === id) ? state.car.cars.map((x) => (x.id === id ? car : x)) : [...state.car.cars, car];
    const makeDefault = f.carId.value === "new" ? false : f.makeDefault && f.makeDefault.checked;
    await store.saveCar({ ...state.car, cars, currentCarId: makeDefault ? id : state.car.currentCarId });
    state.editCarId = id; render(); toast(f.carId.value === "new" ? "Car added" : "Car saved");
  } else if (f.id === "holForm") {
    const hs = [...f.querySelectorAll('[name="holStart"]')], he = [...f.querySelectorAll('[name="holEnd"]')];
    const holidays = hs.map((x, i) => [x.value, he[i].value || x.value]).filter(([a]) => a).map(([a, b]) => (a <= b ? [a, b] : [b, a])).sort();
    await store.saveCar({ ...state.car, holidays }); render(); toast("Holidays saved");
  } else if (f.id === "fuelForm") {
    const x = state.fuelForm, carId = f.carId ? f.carId.value : (state.fuelCarId && carById(state.fuelCarId) ? state.fuelCarId : state.car.currentCarId);
    const num = (v) => (parseFloat(v) > 0 ? parseFloat(v) : null);
    const d = new Date(f.date.value + "T12:00"), at = isNaN(d) ? Date.now() : (isoDay(Date.now()) === f.date.value ? Date.now() : d.getTime());
    const fill = completeFill({ id: x.id || uid(), carId, at, station: f.station.value.trim(), litres: num(f.litres.value), ppl: num(f.ppl.value), total: num(f.total.value), mileage: num(f.mileage.value), full: f.full.checked, photo: x.photo || null });
    if (!fill.litres && !fill.total) { toast("Add the litres or the total so this fill-up counts."); return; }
    if (!(await store.saveFill(fill))) return;
    const car = carById(carId), newest = state.fuel.filter((y) => y.carId === carId).sort((a, b) => b.at - a.at)[0];
    if (car && fill.ppl && newest && newest.id === fill.id && Math.abs(car.ppl - fill.ppl) >= 0.1) {
      await store.saveCar({ ...state.car, cars: state.car.cars.map((c) => (c.id === carId ? { ...c, ppl: fill.ppl } : c)) });
      toast(`Saved. Fuel estimates now use ${fill.ppl.toFixed(1)}p a litre.`);
    } else toast("Fill-up saved");
    state.fuelForm = null; render();
  } else if (f.id === "editForm") {
    const t = state.trips.find((x) => x.id === state.detailId);
    const keep = new Set([...f.querySelectorAll('input[name="keep"]:checked')].map((x) => +x.value));
    const slow = t.slow.filter((_, i) => keep.has(i));
    const mins = parseFloat(f.sMin.value);
    if (f.sAt.value && mins > 0) {
      const [h, m] = f.sAt.value.split(":").map(Number), d = new Date(t.startedAt); d.setHours(h, m, 0, 0);
      let at = d.getTime(); if (at < t.startedAt - 3600000) at += 86400000; // drives past midnight
      at = Math.min(Math.max(at, t.startedAt), t.endedAt - 60000);
      slow.push({ start: at, end: Math.min(at + mins * 60000, t.endedAt), reason: f.sWhy.value, auto: false, added: true, lat: null, lon: null });
    }
    slow.sort((x, y) => x.start - y.start);
    const upd = { ...t, slow, kind: f.kind.value.trim().slice(0, 40) || null, from: f.from.value.trim(), to: f.to.value.trim(), distance: parseFloat(f.distance.value) || 0, mpg: parseFloat(f.mpg.value) || t.mpg, ppl: parseFloat(f.ppl.value) || t.ppl, notes: f.notes.value.trim() };
    if (await store.saveTrip(upd)) { state.editing = false; render(); toast("Changes saved"); }
  }
});

render();
store.init();
})();
</script>
